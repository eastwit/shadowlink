# ShadowLink default configuration.
# Every key here mirrors a dataclass field in src/shadowlink/config.py.
# Override from the command line with e.g. --set retarget.flex_gain=1.2

capture:
  source: camera          # camera | video
  camera: "0"             # camera index, file path, or stream URL
  video: null             # used when source: video
  width: 0                # 0 = native
  height: 0
  mirror: true            # mirror once before perception and display
  api: any                # any | dshow | msmf
  buffer_size: 1
  fps: 0.0                # 0 = source frame rate

perception:
  backend: hamer          # hamer | mediapipe
  side: any               # any | left | right (anatomical)
  pick: track             # largest | center | track
  skip: 1                 # run perception every Nth frame
  max_age_s: 0.5
  min_detection_confidence: 0.3
  rescale_factor: 2.0
  fp16: true
  pipeline: two_stage     # single | two_stage

retarget:
  flex_gain: 1.0
  distal_gain: 1.0
  thumb_base_gain: 1.7
  thumb_flex_gain: 1.1
  thumb_distal_gain: 1.15
  spread_gain: 0.7
  spread_deadzone: 0.03
  spread_clip: 0.45
  thumb_opp_gain: 0.0

smoothing:
  kind: one_euro          # none | exponential | one_euro
  tau: 0.055
  min_cutoff: 1.0
  beta: 0.05
  d_cutoff: 1.0
  max_rate_rad_s: 15.0
  return_rate_rad_s: 6.0
  lost_timeout_s: 0.5
  hold_s: 0.15

sim:
  max_catchup_s: 0.05
  reset_stall_s: 0.5
  viewer: true
  touch_force_scale: 1.0
  start_pose: open hand

ui:
  show: true
  draw: skeleton          # skeleton | mesh | none
  record: null
  window_name: ShadowLink

data:
  data_dir: null          # defaults to SHADOWLINK_DATA or ~/.cache/shadowlink
  checkpoint: null        # defaults to <data_dir>/hamer_ckpts/checkpoints/hamer.ckpt
  hand_model: null        # defaults to <data_dir>/mediapipe/hand_landmarker.task
  calibration: null       # defaults to the per-user config directory

phone:
  source: none            # none | phyphox
  host: null              # phone IP or hostname; required for phyphox unless auto_discover
  port: 8080              # phyphox Remote Access port
  poll_hz: 30.0
  timeout_s: 1.0          # one HTTP request
  retry_s: 1.5            # delay after a connection failure
  auto_start: true        # start a paused experiment on the phone
  auto_discover: false    # opt-in /24 scan on the local network
  auto_follow: false      # follow as soon as a ready sample arrives
  pivot: wrist            # palm | wrist | forearm
  stale_timeout_s: 0.35
  mount_preset: back      # back (strap) | in_hand (held screen-up) | custom
  mount_w: 0.0            # custom phone body -> hand base rotation
  mount_x: 0.7071068      # default: charging port -> elbow, top -> fingers,
  mount_y: 0.0            # screen away from the back of the hand
  mount_z: -0.7071068
  gain: 1.0
  deadzone_deg: 1.5
  max_angle_deg: 180.0    # 180 = no clamp on the relative rotation
  smoothing_tau_s: 0.06
  max_rate_rad_s: 6.0

runtime:
  max_frames: 0
  debug: false
