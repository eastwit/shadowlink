# ShadowLink configuration: built-in webcam for fingers + Astra AprilTag 6-DoF.
# Every key mirrors a dataclass field in src/shadowlink/config.py.
# Override with: --set tag.rotation_gain=1.2
# Camera indices below match this workstation; adjust if Windows enumerates
# them differently.
capture:
  source: camera
  camera: '1'
  video: null
  width: 0
  height: 0
  mirror: true
  api: any
  buffer_size: 1
  fps: 0.0
perception:
  backend: hamer
  side: any
  pick: track
  skip: 1
  max_age_s: 0.5
  min_detection_confidence: 0.3
  rescale_factor: 2.0
  fp16: true
  pipeline: two_stage
retarget:
  flex_gain: 1.0
  distal_gain: 1.0
  thumb_base_gain: 1.7
  thumb_flex_gain: 1.1
  thumb_distal_gain: 1.15
  spread_gain: 0.7
  spread_deadzone: 0.03
  spread_clip: 0.45
  thumb_opp_gain: 0.0
smoothing:
  kind: one_euro
  tau: 0.055
  min_cutoff: 1.0
  beta: 0.05
  d_cutoff: 1.0
  max_rate_rad_s: 15.0
  return_rate_rad_s: 6.0
  lost_timeout_s: 0.5
  hold_s: 0.15
sim:
  max_catchup_s: 0.05
  reset_stall_s: 0.5
  viewer: true
  touch_force_scale: 1.0
  start_pose: open hand
ui:
  show: true
  draw: skeleton
  record: null
  window_name: ShadowLink
data:
  data_dir: null
  checkpoint: null
  hand_model: null
  calibration: null
position:
  enabled: true
  preset: overhead
  invert_x: false
  invert_y: false
  invert_z: false
  gain: 1.0
  deadzone_m: 0.01
  temporal_window: 3
  stale_timeout_s: 0.5
  auto_zero: true
  min_cutoff: 1.2
  beta: 1.5
  d_cutoff: 1.0
  max_rate_m_s: 0.8
tag:
  camera: '0'
  api: dshow
  width: 640
  height: 480
  fps: 30.0
  mirror: auto
  show: true
  zero_mode: fixed
  zero_distance_m: 1.0
  hfov_deg: 60.0
  fx: null
  fy: null
  cx: null
  cy: null
  family: tag36h11
  tag_id: 5
  size_m: 0.057
  quad_decimate: 1.0
  refine_edges: true
  nthreads: 4
  retry_s: 1.0
  stale_timeout_s: 0.5
  auto_follow: true
  pivot: wrist
  rotation_gain: 1.0
  rotation_deadzone_deg: 1.5
  rotation_max_angle_deg: 180.0
  rotation_smoothing_tau_s: 0.12
  rotation_max_rate_rad_s: 3.0
  rotation_jump_reject_deg: 35.0
  rotation_jump_confirm_frames: 5
  min_decision_margin: 10.0
  max_hamming: 1
  rotation_invert_x: false
  rotation_invert_y: false
  rotation_invert_z: false
phone:
  source: none
  host: null
  port: 8080
  poll_hz: 50.0
  timeout_s: 1.0
  retry_s: 1.5
  auto_start: true
  auto_discover: false
  stale_timeout_s: 0.35
  axes: yaw_pitch
  mount_preset: yaw_pitch
  mount_w: 0.0
  mount_x: 0.0
  mount_y: 0.7071068
  mount_z: 0.7071068
  gain: 1.0
  deadzone_deg: 1.0
  max_angle_deg: 180.0
runtime:
  max_frames: 0
  debug: false
