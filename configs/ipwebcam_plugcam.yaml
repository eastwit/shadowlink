# Live profile: IP Webcam phone for hand/fingers + Plugcam phone for the tag.
# Update the IP address shown by IP Webcam and the DirectShow index of the
# Plugcam virtual camera on your machine.

capture:
  source: camera
  camera: "http://192.168.1.109:8080/video"
  api: any
  mirror: true

position:
  preset: overhead
  enabled: true

tag:
  camera: "1"             # Plugcam Camera in the current DirectShow enumeration
  api: dshow
  width: 1920
  height: 1080
  quad_decimate: 2.0
  zero_mode: fixed
  zero_distance_m: 1.0
  auto_follow: true
